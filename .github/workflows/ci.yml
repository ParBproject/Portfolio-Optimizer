name: Portfolio research quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas yfinance scipy cvxpy plotly streamlit ruff

      - name: Lint critical errors
        run: ruff check app.py src data tests --select E4,E7,E9,F

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app.py src data tests

      - name: Verify quantitative imports
        run: |
          python -c "import cvxpy, numpy, pandas; import src.backtest, src.metrics, src.optimizer"
